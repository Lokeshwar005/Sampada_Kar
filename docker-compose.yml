version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sampada_kar_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=sampada_kar_super_secret_production_key_2026
      - CORS_ORIGIN=http://localhost:5173
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    volumes:
      - sampada_data:/app/server/prisma

  # Optional PostgreSQL service for production scale deployment
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: sampada_postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: sampada_user
  #     POSTGRES_PASSWORD: sampada_secure_password
  #     POSTGRES_DB: sampadakar
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  sampada_data:
  # pg_data:
